      .eyebrow { font: 700 17px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.5px; fill: #0078D4; }
      .section { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #14354B; }
      .label { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #153C56; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #55768C; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #67879A; }
      .chip { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #13658E; }
      .card { fill: #FFFFFF; stroke: #C7DFEC; stroke-width: 2; }
      .azure-card { fill: #F7FCFF; stroke: #55B5E1; stroke-width: 2; }
    </style>
